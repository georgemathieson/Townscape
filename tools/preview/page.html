<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Townscape preview</title>
  <style>html, body { margin: 0; background: #000; }</style>
  <script type="importmap">
    { "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
    } }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// Approximations of the Unity lighting presets. Unity is the source of truth; these only exist
// so geometry can be judged in roughly the right mood.
const presets = {
  day:   { fog: 0x9aa3ad, density: 0.006, sky: 0xb8c2cc, ground: 0x4a463e, hemi: 1.6, sun: 0xe8eaf0, sunIntensity: 1.6, elevation: 38, azimuth: 160, exposure: 1.0 },
  dusk:  { fog: 0x3c4155, density: 0.0065, sky: 0x6a6f8a, ground: 0x2a2520, hemi: 1.1, sun: 0xffa868, sunIntensity: 1.8, elevation: 9,  azimuth: 255, exposure: 1.1 },
  night: { fog: 0x12161f, density: 0.011, sky: 0x2a3550, ground: 0x0c0c10, hemi: 0.7, sun: 0x8aa0d0, sunIntensity: 0.45, elevation: 35, azimuth: 120, exposure: 1.3 },
};

// Rain and smoke catch whatever light there is: pale by day, dim at night.
const rainTint = { day: 0xc8ced6, dusk: 0x8a90a6, night: 0x55607a };
const smokeTint = { day: 0x9a9da3, dusk: 0x5d6070, night: 0x2c3140 };

// A lightning strike at night, frozen at the brightest moment of its flash.
presets.flash = { ...presets.night, flash: true };
rainTint.flash = 0xb8c4e8;
smokeTint.flash = 0x7e86a0;
const flashColour = new THREE.Color(0.62, 0.68, 0.92);

const views = {
  overview: { position: [-62, 42, -70], target: [5, 0, 5], fov: 50 },
  bridge:   { position: [-21, 4.5, -23], target: [0, 0.6, 0], fov: 50 },
  street:   { position: [-62, 1.8, -3], target: [0, 1.4, 0], fov: 60 },
  bridgeNight: { position: [-8.5, 2.6, -20], target: [3, 1.2, 3], fov: 55 },
  junction: { position: [30, 12, -22], target: [48, 0, 6], fov: 55 },
  river:    { position: [-6, 3, -42], target: [0, -0.5, 0], fov: 55 },
  valley:   { position: [25, 28, -95], target: [-30, 10, 220], fov: 55 },
  lake:     { position: [-10, 35, -70], target: [120, 0, -400], fov: 55 },
  map:      { ortho: 106 },
  highstreet: { position: [40, 1.7, -4], target: [14, 3.5, 2], fov: 60 },
  shops:    { position: [26, 2.2, -1.5], target: [26, 2.4, 8], fov: 60 },
  shopsSouth: { position: [24, 2.2, 0.5], target: [24, 2.4, -8], fov: 60 },
  village:  { position: [-40, 30, -55], target: [10, 0, 10], fov: 50 },
  church:   { position: [55, 10, 50], target: [82, 8, 72], fov: 55 },
  rooftops: { position: [0, 22, -30], target: [30, 6, 6], fov: 55 },
  mill:     { position: [-4, 5, -50], target: [-19, 4, -70], fov: 55 },
  green:    { position: [-30, 6, 30], target: [-30, 2, 48], fov: 60 },
  phonebox: { position: [-14, 2.2, 3.5], target: [-11, 1.5, 10], fov: 55 },
  lane:     { position: [-60.6, 2, 15], target: [-64, 2, 45], fov: 60 },
  riverside: { position: [9.5, 2, 20], target: [3, 1, 45], fov: 60 },
  puddles:  { position: [-13, 1.4, -1.5], target: [-30, 0.4, -3], fov: 60 },
};

const unity = ([x, y, z]) => new THREE.Vector3(x, y, -z);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(1600, 900);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight();
scene.add(hemi);
const sun = new THREE.DirectionalLight();
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 1, far: 800 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun);
scene.add(sun.target);

const gltf = await new GLTFLoader().loadAsync('/out/town.gltf');
// Views worked out from the town by the exporter, such as the Fellside Coffee game's camera.
const exportedViews = await fetch('/out/views.json');
if (exportedViews.ok) Object.assign(views, await exportedViews.json());

const lighting = await (await fetch('/out/lights.json')).json();
const materials = {};
gltf.scene.traverse((object) => {
  if (object.isMesh) {
    for (const material of [object.material].flat()) materials[material.name] = material;
  }
});
const lampGroup = new THREE.Group();
scene.add(lampGroup);

// The storm, worked out by the same C# simulation Unity uses (see Exporter/StormExport.cs).
const storm = await (await fetch('/out/storm.json')).json();

// It always rains, so every surface the rain changes is wet: darker and glossier.
for (const [name, [r, g, b, roughness]] of Object.entries(storm.wet)) {
  const material = materials[name];
  if (!material) continue;
  material.color.setRGB(r, g, b);
  material.roughness = roughness;
}

// Raindrop rings on puddles, the river and the lake: one frame of Unity's normal-map flipbooks.
function normalTexture(base64, tileMetres) {
  const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
  const texture = new THREE.DataTexture(bytes, storm.ripples.size, storm.ripples.size, THREE.RGBAFormat);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1 / tileMetres, 1 / tileMetres);
  texture.colorSpace = THREE.NoColorSpace;
  texture.magFilter = THREE.LinearFilter;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.generateMipmaps = true;
  texture.needsUpdate = true;
  return texture;
}
const ripples = { Puddle: [normalTexture(storm.ripples.puddle, 1.3), 0.8], Water: [normalTexture(storm.ripples.water, 3.5), 0.7], RiverWater: [normalTexture(storm.ripples.water, 3.5), 0.75] };
for (const [name, [map, strength]] of Object.entries(ripples)) {
  const material = materials[name];
  if (!material) continue;
  material.normalMap = map;
  material.normalScale.set(strength, strength);
  material.needsUpdate = true;
}

// A deterministic random sequence, so renders are repeatable.
function random(seed) {
  let state = seed;
  return () => (state = (state * 16807) % 2147483647) / 2147483647;
}

// Rain: short streaks along the drops' velocity in a box round the camera, as in Unity.
const rainGroup = new THREE.Group();
scene.add(rainGroup);
function makeRain(cameraPosition, presetName) {
  rainGroup.clear();
  const count = Math.round(9000 * storm.rain.amount);
  const fall = new THREE.Vector3(...storm.rain.velocity).normalize().multiplyScalar(0.45);
  const positions = new Float32Array(count * 6);
  const next = random(7);
  for (let i = 0; i < count; i++) {
    const p = new THREE.Vector3((next() - 0.5) * 40, (next() - 0.35) * 22, (next() - 0.5) * 40).add(cameraPosition);
    positions.set([p.x, p.y, p.z, p.x + fall.x, p.y + fall.y, p.z + fall.z], i * 6);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  rainGroup.add(new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color: rainTint[presetName], transparent: true, opacity: 0.4, depthWrite: false })));
}

// Chimney smoke: puffs drifting downwind from each chimney with a fire lit at this hour.
const puffTexture = (() => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255,255,255,1)');
  gradient.addColorStop(0.55, 'rgba(255,255,255,0.45)');
  gradient.addColorStop(1, 'rgba(255,255,255,0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
})();
const smokeGroup = new THREE.Group();
scene.add(smokeGroup);
function makeSmoke(cameraPosition, presetName) {
  smokeGroup.clear();
  const wind = new THREE.Vector3(...storm.wind);
  const next = random(11);
  for (const top of storm.smoke[presetName === 'flash' ? 'night' : presetName] ?? []) {
    const base = new THREE.Vector3(...top);
    if (base.distanceTo(cameraPosition) > 220) continue;
    for (let k = 0; k < 22; k++) {
      // Same motion as ChimneySmokeEffect: rising fast and slowing as it cools, carried and pushed by the wind,
      // with a little wander for the turbulence Unity's noise module adds.
      const age = (k + next()) * 0.31;
      const lifetime = 6.8;
      const position = base.clone()
        .addScaledVector(new THREE.Vector3(0, 1, 0), (1.3 * age) - (0.575 * age * age / lifetime))
        .addScaledVector(wind, (0.4 * age) + (0.025 * age * age))
        .add(new THREE.Vector3(next() - 0.5, next() - 0.5, next() - 0.5).multiplyScalar(0.35 * age));
      const life = age / lifetime;
      const opacity = 0.32 * Math.min(1, life * 12) * Math.max(0, 1 - life) ** 0.8;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTexture, color: smokeTint[presetName], transparent: true, opacity, depthWrite: false }));
      sprite.position.copy(position);
      sprite.scale.setScalar(3 * (0.25 + (0.75 * life)));
      smokeGroup.add(sprite);
    }
  }
}

// Lightning bolts, drawn like LightningEffect: far bolts brought nearer and scaled to look the same.
const boltGroup = new THREE.Group();
scene.add(boltGroup);
const lightning = new THREE.DirectionalLight(flashColour, 0);
scene.add(lightning);
scene.add(lightning.target);
function makeBolts(camera, flash) {
  boltGroup.clear();
  if (!flash) return;
  const toCamera = new THREE.Vector3();
  for (const bolt of storm.bolts) {
    const ground = new THREE.Vector3(...bolt[bolt.length - 1][1]);
    const distance = ground.distanceTo(camera.position);
    const scale = Math.min(1, 950 / distance);
    const width = 0.0012 * distance * scale * 1.6;
    for (const [glow, colour] of [[1, new THREE.Color(7, 7.5, 10)], [4, new THREE.Color(0.35, 0.37, 0.5)]]) {
      const positions = [];
      for (const [a, b, w] of bolt) {
        if (glow > 1 && w < 1) continue;
        const start = camera.position.clone().lerp(new THREE.Vector3(...a), scale);
        const end = camera.position.clone().lerp(new THREE.Vector3(...b), scale);
        toCamera.subVectors(camera.position, start);
        const side = new THREE.Vector3().subVectors(end, start).cross(toCamera).normalize().multiplyScalar(width * w * glow * 0.5);
        positions.push(...start.clone().add(side).toArray(), ...start.clone().sub(side).toArray(), ...end.clone().add(side).toArray());
        positions.push(...end.clone().add(side).toArray(), ...start.clone().sub(side).toArray(), ...end.clone().sub(side).toArray());
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      boltGroup.add(new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: colour, fog: false, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide })));
    }
  }
  // Light from the first bolt's direction, as LightningEffect does.
  const strike = new THREE.Vector3(...storm.bolts[0][storm.bolts[0].length - 1][1]);
  lightning.position.copy(strike).setY(400);
  lightning.target.position.set(0, 0, 0);
}
gltf.scene.traverse((object) => {
  if (!object.isMesh) return;
  const category = object.parent?.userData?.category ?? object.userData?.category;
  object.castShadow = category !== 'Water' && category !== 'Markings';
  object.receiveShadow = true;
});
scene.add(gltf.scene);

// A simple gradient sky as the environment, so smooth surfaces such as water reflect something
// (Unity gets the same from a generated reflection cubemap).
const pmrem = new THREE.PMREMGenerator(renderer);
const environments = {};
function environmentFor(preset) {
  const key = `${preset.sky}-${preset.fog}-${preset.ground}`;
  if (environments[key]) return environments[key];
  const envScene = new THREE.Scene();
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(10, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        top: { value: new THREE.Color(preset.sky) },
        horizon: { value: new THREE.Color(preset.fog) },
        bottom: { value: new THREE.Color(preset.ground) },
      },
      vertexShader: 'varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; varying vec3 vDir; void main() { float y = vDir.y; vec3 c = y > 0.0 ? mix(horizon, top, pow(y, 0.6)) : mix(horizon, bottom, pow(-y, 0.4)); gl_FragColor = vec4(c, 1.0); }',
    }));
  envScene.add(sky);
  environments[key] = pmrem.fromScene(envScene).texture;
  return environments[key];
}

window.renderView = (viewName, presetName) => {
  const preset = presets[presetName];
  scene.environment = environmentFor(preset);
  scene.environmentIntensity = 0.6;
  const view = views[viewName];
  // Lightning washes the fog and the shadows with a cold light (WeatherLighting in Unity); mist thickens the fog.
  const flash = preset.flash ? 1 : 0;
  const fog = new THREE.Color(preset.fog).lerp(flashColour.clone().multiplyScalar(0.75), flash * 0.4);
  scene.background = fog;
  scene.fog = viewName === 'map' ? null : new THREE.FogExp2(fog, preset.density * (0.9 + (0.3 * storm.rain.mist)));
  hemi.color.set(preset.sky).lerp(flashColour, flash * 0.5);
  hemi.groundColor.set(preset.ground);
  hemi.intensity = preset.hemi * (1 + (1.2 * flash));
  lightning.intensity = 1.6 * Math.PI * flash;
  sun.color.set(preset.sun);
  sun.intensity = preset.sunIntensity;
  renderer.toneMappingExposure = preset.exposure;

  // Glow and point lights for this time of day, as worked out by NightLights in C#.
  const night = lighting[presetName === 'flash' ? 'night' : presetName];
  for (const [name, rgb] of Object.entries(night?.emission ?? {})) {
    const material = materials[name];
    if (!material) continue;
    material.emissive = new THREE.Color(rgb[0], rgb[1], rgb[2]);
    material.emissiveIntensity = 1;
  }
  lampGroup.clear();
  for (const light of night?.lights ?? []) {
    // Unity's diffuse lighting has no 1/π, three.js's does, so the same light needs π times the intensity here.
    const point = new THREE.PointLight(new THREE.Color(light.c[0], light.c[1], light.c[2]), light.i * Math.PI, light.r, 2);
    point.position.set(light.p[0], light.p[1], light.p[2]);
    lampGroup.add(point);
  }

  const el = THREE.MathUtils.degToRad(preset.elevation);
  const az = THREE.MathUtils.degToRad(preset.azimuth);
  // Azimuth measured clockwise from north (Unity +z), so the light comes from that compass bearing.
  const fromSun = unity([Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)]);
  sun.position.copy(fromSun.multiplyScalar(300));
  sun.target.position.set(0, 0, 0);

  let camera;
  if (view.ortho) {
    const aspect = 1600 / 900;
    camera = new THREE.OrthographicCamera(-view.ortho * aspect, view.ortho * aspect, view.ortho, -view.ortho, 1, 1000);
    camera.position.set(0, 400, 0);
    camera.up.set(0, 0, -1);
    camera.lookAt(0, 0, 0);
  } else {
    camera = new THREE.PerspectiveCamera(view.fov, 1600 / 900, 0.1, 3000);
    camera.position.copy(unity(view.position));
    camera.lookAt(unity(view.target));
  }

  const showWeather = viewName !== 'map';
  rainGroup.visible = smokeGroup.visible = showWeather;
  if (showWeather) {
    makeRain(camera.position, presetName);
    makeSmoke(camera.position, presetName);
  }
  makeBolts(camera, flash > 0 && showWeather);

  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.previewReady = true;
</script>
</body>
</html>
